name: Sincronizar Repositorio

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repository:
          - editoranerson/dante-s-inferno-reader
          - editoranerson/universo-dante
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Espelhar para o repositorio secundario
        env:
          DEST_TOKEN: ${{ secrets.SYNC_TOKEN }}
          DEST_REPOSITORY: ${{ matrix.repository }}
        run: |
          git remote add destino "https://editoranerson:${DEST_TOKEN}@github.com/${DEST_REPOSITORY}.git"
          git push --force --prune destino +refs/remotes/origin/*:refs/heads/* +refs/tags/*:refs/tags/*
