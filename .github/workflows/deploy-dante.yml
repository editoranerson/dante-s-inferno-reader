name: Deploy Dante Edge Function

on:
  push:
    paths:
      - 'supabase/functions/chat-dante/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy da Edge Function
        run: |
          supabase functions deploy chat-dante --project-ref kpplssyiehosifuejobr --no-verify-jwt --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          
